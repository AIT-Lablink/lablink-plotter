services:
  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ../config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # A Windows bind mount is world-writable, which Mosquitto 2 refuses to load.
    # The copy script has to be a single argument. A plain string is split, and sh -c then runs cp with no arguments.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "cp /mosquitto/config/mosquitto.conf /tmp/mosquitto.conf && chmod 600 /tmp/mosquitto.conf && exec /usr/sbin/mosquitto -c /tmp/mosquitto.conf"
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  lablink-config:
    image: ait1/lablink-config-server:latest
    volumes:
      - ../config/test-config.db:/app/config.db
    ports:
      - "10101:10101"

  dpb:
    image: ait1/lablink-datapoint-bridge:latest
    environment:
      LLCONFIG: http://lablink-config:10101/get?id=
      DPB_CONFIG: ait.test.plotter.sync.dpb.config
      LOGGER_ID: ait.test.plotter.all.dpb.log4j2
    depends_on:
      mqtt:
        condition: service_healthy
      lablink-config:
        condition: service_started

  source:
    image: lablink-plotter-example-source
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile.source
    environment:
      LLCONFIG: http://lablink-config:10101/get?id=
      LOGGER_ID: ait.all.all.log4j2
      MAIN_CLASS: sync.DataSourceSync
    depends_on:
      mqtt:
        condition: service_healthy
      lablink-config:
        condition: service_started

  plotter:
    image: ait1/lablink-plotter:latest
    environment:
      LLCONFIG: http://lablink-config:10101/get?id=
      PLOT_CLASS: at.ac.ait.lablink.clients.plotter.PlotterSync
      PLOT_CONFIG: ait.test.plotter.sync.config
      LOGGER_ID: ait.all.all.log4j2
      MEMORY_FLAG: -Xmx1024m
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    depends_on:
      mqtt:
        condition: service_healthy
      lablink-config:
        condition: service_started

  sync-host:
    image: ait1/lablink-sync-host:latest
    profiles: ["sync-host"]
    environment:
      LLCONFIG: http://lablink-config:10101/get?id=
      SYNC_CONFIG: ait.test.plotter.sync.sync-host.properties
      LOGGER_ID: ait.all.all.log4j2
    volumes:
      - ./sync_config_plotter.json:/app/sync_config_plotter.json:ro
    depends_on:
      mqtt:
        condition: service_healthy
      lablink-config:
        condition: service_started
      dpb:
        condition: service_started
      source:
        condition: service_started
      plotter:
        condition: service_started
